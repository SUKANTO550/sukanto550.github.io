<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Virtual Lab</title>
<style>
:root{
  --bg:#1d232b; --panel:#232b35ee; --panel2:#2c3642; --line:#3b4756; --text:#e8edf2; --muted:#9aa8b8;
  --accent:#4fb0ff; --ok:#46c37b; --warn:#f2b632; --bad:#ff7a59; --info:#8fa3b8;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);
  font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{position:fixed;inset:0}
#app canvas{display:block}
button{font:inherit;color:inherit;background:var(--panel2);border:1px solid var(--line);border-radius:8px;
  padding:6px 10px;cursor:pointer}
button:hover{border-color:var(--accent)}
button:disabled{opacity:.45;cursor:default}
.ui{position:fixed;z-index:5}
#views{top:12px;left:12px;display:flex;flex-wrap:wrap;gap:6px;max-width:calc(100vw - 440px)}
#views button{background:var(--panel);font-size:13px;padding:5px 9px}
#views .title{font-weight:700;padding:5px 12px;letter-spacing:.3px;background:var(--panel);border:1px solid var(--line);border-radius:8px}
#topright{top:12px;right:12px;display:flex;gap:6px}
#topright button{background:var(--panel)}
#hand{bottom:12px;left:50%;transform:translateX(-50%);background:var(--panel);border:1px solid var(--line);
  border-radius:10px;padding:8px 14px;max-width:min(860px,calc(100vw - 24px));text-align:center;color:var(--muted)}
#hand b{color:var(--text)}
body.noHand #toasts{bottom:14px}
.set label{display:flex;align-items:center;gap:10px;margin:10px 0;cursor:pointer}
.set input[type=checkbox]{width:18px;height:18px;accent-color:#4fb0ff}
#toasts{bottom:64px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column-reverse;gap:6px;
  align-items:center;pointer-events:none;width:min(640px,calc(100vw - 24px))}
.toast{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--info);border-radius:8px;
  padding:7px 12px;box-shadow:0 4px 18px #0006;animation:tin .18s ease-out}
.toast.warn{border-left-color:var(--warn)} .toast.bad{border-left-color:var(--bad)} .toast.ok{border-left-color:var(--ok)}
@keyframes tin{from{opacity:0;transform:translateY(6px)}to{opacity:1}}
#tip{pointer-events:none;background:#11161cf0;border:1px solid var(--line);border-radius:8px;padding:6px 10px;
  max-width:340px;display:none;font-size:13px}
#tip .n{font-weight:700} #tip .s{color:var(--muted)}
#menu{display:none;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px;
  min-width:220px;box-shadow:0 8px 28px #0008}
#menu .h{color:var(--muted);font-size:12px;padding:4px 8px 6px}
#menu button{display:block;width:100%;text-align:left;margin:2px 0;background:transparent;border-color:transparent}
#menu button:hover{background:var(--panel2);border-color:var(--line)}
#panel{display:none;top:60px;right:12px;width:300px;background:var(--panel);border:1px solid var(--line);
  border-radius:12px;padding:12px 14px;box-shadow:0 8px 28px #0008}
#panel h3{margin:0 0 4px;font-size:15px}
#panel .sub{color:var(--muted);font-size:12px;margin-bottom:10px}
#panel label{display:block;margin:10px 0 2px;font-size:13px}
#panel input[type=range]{width:100%}
#panel .row{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
#panel .x{position:absolute;top:8px;right:8px;padding:2px 8px}
#log{display:none;top:60px;left:12px;width:320px;max-height:60vh;overflow:auto;background:var(--panel);
  border:1px solid var(--line);border-radius:12px;padding:10px 12px}
#log h3{margin:0 0 6px;font-size:15px}
#log .e{border-top:1px solid var(--line);padding:6px 0;font-size:13px}
#log .t{color:var(--muted);font-size:11px}
#dlg{display:none;position:fixed;inset:0;z-index:20;background:#0008;align-items:center;justify-content:center}
#dlg .box{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:16px 18px;
  width:min(420px,calc(100vw - 32px));max-height:85vh;overflow:auto}
#dlg h3{margin:0 0 8px}
#dlg .row{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
#dlg input[type=range]{width:100%}
#dlg .big{font-size:22px;font-weight:700;text-align:center;margin:8px 0}
#dlg p{margin:6px 0;color:var(--muted)}
#dlg .about{text-align:center}
#dlg .about hr{border:0;border-top:1px solid var(--line);margin:10px 0}
#dlg .about .nm{font-size:20px;font-weight:700}
#pour{display:none;bottom:120px;left:50%;transform:translateX(-50%);background:var(--panel);border:1px solid var(--line);
  border-radius:12px;padding:12px 16px;text-align:center;min-width:300px}
#pour .amt{font-size:22px;font-weight:700;margin:4px 0 8px}
#pour .hold{background:var(--accent);color:#06121e;border:0;font-weight:700;padding:10px 18px;user-select:none}
#badges{position:fixed;inset:0;pointer-events:none;z-index:4}
.badge{position:absolute;transform:translate(-50%,-100%);display:flex;align-items:center;gap:4px;
  background:#11161ce6;border:1px solid var(--line);border-radius:14px;padding:2px 7px 2px 3px;font-size:12px;white-space:nowrap}
.badge svg{display:block}
.badge.ok{border-color:var(--ok);color:var(--ok);padding:2px 6px}
.badge.warn{border-color:var(--warn);color:var(--warn);padding:2px 6px}
.badge.boil{border-color:var(--bad);color:var(--bad);padding:2px 6px}
/* ---- touch screens ---- */
canvas{touch-action:none}
body{overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button{touch-action:manipulation}
#views .go{display:none}
#hand .pb{margin-left:10px;padding:4px 10px}
#tcard{display:none;background:#11161cf2;border:1px solid var(--line);border-radius:12px;padding:10px 12px;max-width:min(340px,calc(100vw - 24px));
  box-shadow:0 8px 28px #0008}
#tcard .n{font-weight:700;margin-bottom:2px} #tcard .s{color:var(--muted);font-size:13px}
#tcard .row{display:flex;gap:8px;margin-top:10px;justify-content:flex-end}
#joy{display:none;left:calc(18px + env(safe-area-inset-left));bottom:calc(18px + env(safe-area-inset-bottom));width:116px;height:116px;border-radius:50%;
  background:#11161c99;border:2px solid #ffffff2a;touch-action:none}
#joy .k{position:absolute;left:33px;top:33px;width:46px;height:46px;border-radius:50%;background:#4fb0ffcc;border:2px solid #ffffff55;pointer-events:none}
#joyUD{display:none;left:calc(146px + env(safe-area-inset-left));bottom:calc(22px + env(safe-area-inset-bottom));flex-direction:column;gap:8px}
#joyUD button{width:46px;height:46px;border-radius:50%;padding:0;font-size:12px;background:#11161cbb;touch-action:none}
body.touch #joy{display:block} body.touch #joyUD{display:flex}
@media (pointer:coarse){
  button{padding:9px 13px;font-size:15px}
  #views button{padding:8px 11px;font-size:14px}
  #views{max-width:calc(100vw - 510px)}
  #menu button{padding:12px}
  input[type=range]{height:34px}
  .set input[type=checkbox]{width:24px;height:24px}
  #panel .x{padding:6px 12px}
  #pour .hold{padding:16px 22px;font-size:17px}
}
#panel{width:min(300px,calc(100vw - 24px));max-height:calc(100vh - 80px);overflow:auto}
#log{width:min(320px,calc(100vw - 24px))}
#menu{max-width:calc(100vw - 16px)}
@media (max-width:760px){
  #views{max-width:calc(100vw - 24px)}
  #views .go{display:inline-block}
  #views button[data-v]{display:none}
  #views.open{flex-direction:column;align-items:stretch}
  #views.open button[data-v]{display:block}
  #topright{top:auto;bottom:calc(14px + env(safe-area-inset-bottom));right:12px;flex-wrap:wrap;justify-content:flex-end;max-width:52vw}
  #topright button{font-size:12px;padding:6px 8px}
  #panel{top:56px}
  #hand{bottom:auto;top:58px;max-width:calc(100vw - 24px)}
  #pour{min-width:0;width:calc(100vw - 24px);bottom:150px}
}
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:30;background:var(--bg);
  color:var(--muted);font-size:16px}
</style>
</head>
<body>
<div id="app"></div>
<div id="badges"></div>
<div id="views" class="ui">
  <span class="title">Virtual Lab</span>
  <button class="go" id="bGo">Go to ▾</button>

<script type="module">
import * as THREE from 'three';
const HK = window.LAB_HOOKS || {};   // actions/lab_hooks.js: close-up clips get the first say at pour / draw / dispense
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { toCreasedNormals, mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { GTAOPass } from 'three/addons/postprocessing/GTAOPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { RectAreaLightUniformsLib } from 'three/addons/lights/RectAreaLightUniformsLib.js';

/* =====================================================================
   DATA — edit freely. Sources: "literature" = Claude, "owner" = lab value.
   Owner values always win (put them in OWNER_COLORS).
   ===================================================================== */

// Air drying time (s) after a solvent rinse. Game-scaled, real ratio kept (see instructions 2.4c).
const DRY_AIR = { acetone: 5, ethanol: 18, ipa: 20, water: 80 };
const OVEN_MIN_DRY = 3;          // glass needs time to heat up
const DRY_DOUBLE_PER_C = 20;     // drying ~2x faster per +20 °C

// Chemicals. form: liquid|solid. bottle: amber|opaque|carboy. solid = colour of the solid,
// sol = colour it gives when dissolved (null = colourless), k = colour strength,
// rho = density g/ml (liquids), bp = boiling point °C (liquids).
const CHEM = {
  bi:     { name:'Bismuth nitrate', formula:'Bi(NO3)3·5H2O', form:'solid', bottle:'opaque', solid:'#f6f5ef', sol:null, k:0, src:'literature' },
  fe:     { name:'Iron nitrate', formula:'Fe(NO3)3·9H2O', form:'solid', bottle:'opaque', solid:'#d8c8e4', sol:'#c98516', k:40, src:'literature' },
  mn:     { name:'Manganese nitrate', formula:'Mn(NO3)2·4H2O', form:'solid', bottle:'opaque', solid:'#f3cdd6', sol:'#f0c4cf', k:6, src:'literature' },
  co:     { name:'Cobalt nitrate', formula:'Co(NO3)2·6H2O', form:'solid', bottle:'opaque', solid:'#b3203f', sol:'#d0466e', k:30, src:'literature' },
  ni:     { name:'Nickel nitrate', formula:'Ni(NO3)2·6H2O', form:'solid', bottle:'opaque', solid:'#3f9e4d', sol:'#4aa85a', k:25, src:'literature' },
  cr:     { name:'Chromium nitrate', formula:'Cr(NO3)3·9H2O', form:'solid', bottle:'opaque', solid:'#4a2a63', sol:'#5c4185', k:40, src:'literature' },
  la:     { name:'Lanthanum nitrate', formula:'La(NO3)3·6H2O', form:'solid', bottle:'opaque', solid:'#f7f7f4', sol:null, k:0, src:'literature' },
  sm:     { name:'Samarium nitrate', formula:'Sm(NO3)3·6H2O', form:'solid', bottle:'opaque', solid:'#f1e7a6', sol:'#f3e9a0', k:5, src:'literature' },
  nd:     { name:'Neodymium nitrate', formula:'Nd(NO3)3·6H2O', form:'solid', bottle:'opaque', solid:'#d9c3ea', sol:'#d6c0e8', k:6, src:'literature' },
  citric: { name:'Citric acid', formula:'C6H8O7', form:'solid', bottle:'opaque', solid:'#fbfbf8', sol:null, k:0, src:'literature' },
  peg:    { name:'Polyethylene glycol 4000', formula:'PEG 4000', form:'solid', bottle:'opaque', solid:'#fbfbf6', sol:null, k:0, src:'literature' },
  naoh:   { name:'Sodium hydroxide pellets', formula:'NaOH', form:'solid', bottle:'opaque', solid:'#fdfdfb', sol:null, k:0, src:'literature' },
  hno3:   { name:'Nitric acid', formula:'HNO3 (~65%)', form:'liquid', bottle:'amber', liq:null, rho:1.39, bp:120, src:'literature' },
  moe:    { name:'2-Methoxyethanol', formula:'2-MOE', form:'liquid', bottle:'amber', liq:null, rho:0.965, bp:124, src:'literature' },
  acetic: { name:'Acetic acid (glacial)', formula:'CH3COOH', form:'liquid', bottle:'amber', liq:null, rho:1.049, bp:118, src:'literature' },
  acac:   { name:'Acetylacetone', formula:'acac', form:'liquid', bottle:'amber', liq:'#fff1b8', k:0.6, rho:0.975, bp:140, src:'literature' },
  eg:     { name:'Ethylene glycol', formula:'C2H6O2', form:'liquid', bottle:'opaque', liq:null, rho:1.113, bp:197, src:'literature' },
  acetone:{ name:'Acetone', formula:'C3H6O', form:'liquid', bottle:'amber', liq:null, rho:0.784, bp:56, src:'literature' },
  ethanol:{ name:'Ethanol', formula:'C2H5OH', form:'liquid', bottle:'amber', liq:null, rho:0.789, bp:78, src:'literature' },
  ipa:    { name:'Isopropanol (IPA)', formula:'C3H8O', form:'liquid', bottle:'amber', liq:null, rho:0.786, bp:82, src:'literature' },
  water:  { name:'DI water', formula:'H2O', form:'liquid', bottle:'carboy', liq:null, rho:1.0, bp:100, src:'literature' },
};

// Owner overrides, e.g.  fe: { solid:'#e0d0ea', sol:'#b8700f' }
const OWNER_COLORS = {};

// Pre-recorded colour changes (literature). Checked in order; first matching wins per rule.
// test(c, v) gets: c = concentrations (g/ml dissolved, volume fraction for liquids), v = vessel.
const REACTIONS = [
  { id:'fe_acac', note:'Fe(III) + acetylacetone → Fe(acac)3, deep red', color:'#8e1414', strength:c=>c.fe*120*(c.acac>0.005?1:0) },
  { id:'fe_naoh', note:'Fe(III) + NaOH → Fe(OH)3, brown precipitate', color:'#7a3d14', cloudy:true, strength:c=>(c.fe>0&&c.naoh>0)?6:0 },
  { id:'ni_naoh', note:'Ni(II) + NaOH → Ni(OH)2, green precipitate', color:'#76a865', cloudy:true, strength:c=>(c.ni>0&&c.naoh>0)?5:0 },
  { id:'bi_water', note:'Bi(NO3)3 hydrolyses in plain water → white BiONO3 (cloudy). Acid keeps it clear.', color:'#f4f4f0', cloudy:true,
    strength:c=>(c.bi>0 && c.water>0.5 && (c.hno3+c.acetic)<0.03 && c.citric<0.02)?4:0 },
  { id:'cr_heat', note:'Cr(III) nitrate solution turns green when heated', color:'#4f7f3a', strength:(c,v)=>(c.cr>0 && v.maxTemp>60)?c.cr*50:0 },
];

const HOTPLATES = [
  { name:'Hotplate stirrer A (600 °C)', maxT:600, maxRpm:1500, costly:false, heat:true },
  { name:'Hotplate stirrer B (500 °C, digital)', maxT:500, maxRpm:1500, costly:true, heat:true },
  { name:'Hotplate stirrer C (400 °C)', maxT:400, maxRpm:1500, costly:false, heat:true },
  { name:'Mini magnetic stirrer (no heat)', maxT:0, maxRpm:1500, costly:false, heat:false },
];
const OVEN_MAX = 200;
// Stirring vortex: stirrer rpm -> vortex depth as a FRACTION of the liquid height (centre dip).
// Relative look, not measured. Below ~100 rpm the surface stays flat; at high rpm the funnel
// reaches down towards the stir bar. Edit the pairs to tune; values in between are interpolated.
const VORTEX = [
  [0, 0], [100, 0],        // flat
  [300, 0.08],             // slight dimple
  [600, 0.28],             // clear funnel
  [900, 0.55],             // deep funnel
  [1200, 0.8],             // reaches near the stir bar
  [1500, 0.92],
];
const vortexFrac = rpm => { for (let i = 1; i < VORTEX.length; i++) if (rpm <= VORTEX[i][0]) {
  const [r0, f0] = VORTEX[i - 1], [r1, f1] = VORTEX[i]; return f0 + (f1 - f0) * (rpm - r0) / (r1 - r0 || 1); } return VORTEX[VORTEX.length - 1][1]; };
const MAIN_OFF_RACK_SECONDS = 30;

for (const [id, o] of Object.entries(OWNER_COLORS)) if (CHEM[id]) Object.assign(CHEM[id], o, { src:'owner' });

/* =====================================================================
   SCENE
   ===================================================================== */
const $ = s => document.querySelector(s);
// touch screen (tablet / phone): finger-sized UI, joystick, lighter defaults
const COARSE = matchMedia('(pointer: coarse)').matches || navigator.maxTouchPoints > 0 && !matchMedia('(pointer: fine)').matches;
if (COARSE) document.body.classList.add('touch');
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, COARSE ? 1.5 : 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.shadowMap.autoUpdate = false;   // the room is mostly still: see shadowTick() in the loop
renderer.shadowMap.needsUpdate = true;
$('#app').appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color('#1d232b');
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(66, innerWidth / innerHeight, 0.004, 60);
camera.position.set(0.6, 8.2, 4.6);
// Own camera control. `target` = the point the camera looks at (kept in front of it).
// Right-drag rotates smoothly around whatever surface is under the mouse when the drag starts.
const controls = { target: new THREE.Vector3(0, 0.4, -0.2), update() { camera.lookAt(this.target); } };

let QUALITY = 'high';
try { QUALITY = localStorage.getItem('vl_quality') || (COARSE ? 'normal' : 'high'); } catch (e) { if (COARSE) QUALITY = 'normal'; }
RectAreaLightUniformsLib.init();
scene.add(new THREE.HemisphereLight(0xffffff, 0x3a4250, 0.38));
const sun = new THREE.DirectionalLight(0xfff6ea, 1.15);
sun.position.set(2.5, 7, 3.5);
sun.castShadow = true;
sun.shadow.mapSize.set(QUALITY === 'high' ? 4096 : 2048, QUALITY === 'high' ? 4096 : 2048); sun.shadow.radius = 3;
Object.assign(sun.shadow.camera, { left:-5, right:5, top:5, bottom:-5, near:1, far:20 });
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.02;
scene.add(sun);
const fill = new THREE.DirectionalLight(0xdfe8ff, 0.45); fill.position.set(-3, 4, -2.5); scene.add(fill);

const M = {
  glass: new THREE.MeshStandardMaterial({ color:0xe4f1ee, roughness:0.3, metalness:0, transparent:true, opacity:0.14,

// marks on a lathe vessel (beaker, flask, cylinder): v ml -> inner liquid height
function gradVessel(it, o) {
  const inner = it.vessel.inner;
  addGrad(it, { ...o, yOf: v => heightFor(it.vessel, v), rOf: y => rAt(inner, y) + 0.0016 });

/* ---------- printed glassware artwork (owner's photos: OMSONS beaker / conical flasks, WITHOUT the brand
   name and "GERMANY") ----------
   One canvas wrapped round the front of the vessel (a lathe band that follows the glass, so on a cone
   the print tapers and tilts like a real decal). Canvas x = angle around the vessel, y = height.
   Volume marks use the SAME volume table as the liquid. Identical vessels share one texture. */
function qrPattern(g, x, y, sz, seed) {           // generic QR-like code (three finder squares + random modules)
  const n = 21, c = sz / n; let s0 = seed;
  const rnd = () => (s0 = (s0 * 9301 + 49297) % 233280) / 233280;
  for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) if (rnd() < 0.48) g.fillRect(x + i * c, y + j * c, c, c);
  for (const [fx, fy] of [[0, 0], [n - 7, 0], [0, n - 7]]) {
    g.clearRect(x + (fx - 0.5) * c, y + (fy - 0.5) * c, 8 * c, 8 * c);
    g.fillRect(x + fx * c, y + fy * c, 7 * c, 7 * c); g.clearRect(x + (fx + 1) * c, y + (fy + 1) * c, 5 * c, 5 * c);
    g.fillRect(x + (fx + 2) * c, y + (fy + 2) * c, 3 * c, 3 * c);
  }
}
function printVessel(it, o) {
  const v = it.vessel, cap = o.cap, wall = o.wall;
  const yOf = ml => heightFor(v, ml), rOf = y => rAt(v.inner, y) + wall + 0.0004;
  const y0 = o.y0, y1 = o.y1, phiLen = o.phiLen, rRef = rOf((y0 + y1) / 2);
  const ppm = Math.min(9000, 2048 / (phiLen * rRef), 2048 / (y1 - y0));
  const W = Math.round(phiLen * rRef * ppm), Hc = Math.round((y1 - y0) * ppm);
  const tex = texCache(o.key, () => {
    const c = document.createElement('canvas'); c.width = W; c.height = Hc; const g = c.getContext('2d');
    const X = a => W / 2 + a * ppm, Y = y => (1 - (y - y0) / (y1 - y0)) * Hc, F = m => Math.max(6, m * ppm);
    g.strokeStyle = g.fillStyle = o.color; g.lineCap = 'butt';
    o.draw(g, { X, Y, F, yOf, ppm, W, Hc });
    const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t;
  });
  const pts = []; const N = 40;
  for (let i = 0; i <= N; i++) { const y = y0 + (y1 - y0) * i / N; pts.push(new THREE.Vector2(rOf(y), y)); }
  const m = new THREE.Mesh(new THREE.LatheGeometry(pts, 48, -phiLen / 2, phiLen),
    new THREE.MeshBasicMaterial({ map: tex, transparent: true, depthWrite: false, side: THREE.DoubleSide }));
  m.renderOrder = 4; it.obj.add(m);
}
const txt = (g, s, x, y, size, align = 'center', weight = 500) => { g.font = `${weight} ${size}px Arial,Helvetica,sans-serif`; g.textAlign = align; g.textBaseline = 'middle'; g.fillText(s, x, y); };
const vtxt = (g, s, x, y, size) => { g.save(); g.translate(x, y); g.rotate(-Math.PI / 2); txt(g, s, 0, 0, size); g.restore(); };
const rrect = (g, x, y, w, h, r) => { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); };

// BEAKER (blue print, photo): spout is on the right (+x) here, so the photo layout is mirrored:
// scale block on the left, label block on the right (nearer the spout, as on the real beaker).
function printBeaker(it, ml, R, H, w) {
  const L = { 100:20, 125:25, 250:50, 500:100 }[ml], mid = L / 2, first = L;
  printVessel(it, { key:'beaker-print-' + ml, cap: ml, wall: w, color:'#1f6fc4', phiLen: 2.3, y0: H * 0.12, y1: H * 0.93, draw: (g, k) => {
    const { X, Y, F, yOf, ppm } = k;
    const lx = -0.42 * R, lw = 0.0024 * ppm * 0.15;
    g.lineWidth = Math.max(1.5, 0.00028 * ppm);
    // vertical scale line + majors (long, crossing) + mid ticks
    g.beginPath(); g.moveTo(X(lx), Y(yOf(first))); g.lineTo(X(lx), Y(yOf(ml))); g.stroke();
    for (let v = first; v <= ml + 1e-6; v += mid) {
      const major = Math.abs(v / L - Math.round(v / L)) < 1e-6, y = Y(yOf(v));
      const a = major ? 0.2 * R : 0.085 * R;
      g.beginPath(); g.moveTo(X(lx - a), y); g.lineTo(X(lx + a), y); g.stroke();
      if (major) {
        txt(g, String(v), X(lx - 0.24 * R), y, F(0.11 * R), 'right', 400);            // big: volume in the beaker
        txt(g, String(ml - v), X(lx + 0.24 * R), y, F(0.06 * R), 'left', 400);         // small: counted from the top
      }
    }
    txt(g, '±5%', X(lx - 0.24 * R), Y(yOf(ml)) + F(0.12 * R), F(0.06 * R), 'right', 400);
    // label block: size, blue marking patch, Boro 3.3, QR + "Scan for Certificate"
    const cx = 0.42 * R;
    txt(g, `${ml}mL`, X(cx), Y(H * 0.55), F(0.15 * R), 'center', 400);
    const pw = 0.56 * R * ppm, ph = 0.3 * R * ppm, px = X(cx) - pw / 2, py = Y(H * 0.5);
    rrect(g, px, py, pw, ph, ph * 0.22); g.fill();
    vtxt(g, 'Boro 3.3', px - F(0.07 * R), py + ph / 2, F(0.065 * R));
    const q = 0.3 * R * ppm; qrPattern(g, X(cx) - q / 2, py + ph + F(0.07 * R), q, ml * 13 + 7);
    txt(g, 'Scan for Certificate', X(cx), py + ph + F(0.07 * R) + q + F(0.05 * R), F(0.04 * R), 'center', 400);
  } });
}

// CONICAL FLASK (grey print, photos): framed label on the left, scale on the right.
// Narrow-mouth flask: IS 1381 + QR; screw-cap flask: QR + "Scan for Certificate".
function printFlask(it, ml, R, hc, w, screw) {
  const L = { 50:10, 100:20, 150:25, 250:50 }[ml], first = Math.ceil(ml * 0.4 / L) * L;
  printVessel(it, { key:'flask-print-' + ml + (screw ? 's' : ''), cap: ml, wall: w, color:'#1f6fc4', phiLen: 2.5, y0: hc * 0.1, y1: Math.min(hc * 0.98, it.vessel ? heightFor(it.vessel, ml) + 0.012 : hc), draw: (g, k) => {
    const { X, Y, F, yOf, ppm } = k;
    const r = R * 0.8;                                     // sizes relative to the radius around the print
    g.lineWidth = Math.max(1.5, 0.00028 * ppm);
    // scale: vertical line with ticks to the right, numbers, ±5%, BORO 3.3 along the line
    const sx = 0.04 * r;
    g.beginPath(); g.moveTo(X(sx), Y(yOf(first))); g.lineTo(X(sx), Y(yOf(ml))); g.stroke();
    for (let v = first; v <= ml + 1e-6; v += L) {
      const y = Y(yOf(v)); g.beginPath(); g.moveTo(X(sx), y); g.lineTo(X(sx + 0.24 * r), y); g.stroke();
      txt(g, String(v), X(sx + 0.3 * r), y, F(0.13 * r), 'left', 400);
    }
    txt(g, '±5%', X(sx + 0.3 * r), Y(yOf(ml)) + F(0.13 * r), F(0.065 * r), 'left', 400);
    vtxt(g, 'BORO 3.3', X(sx - 0.07 * r), (Y(yOf(first)) + Y(yOf(ml))) / 2 + F(0.12 * r), F(0.065 * r));
    // framed label (left)
    const fx0 = X(-0.98 * r), fx1 = X(-0.14 * r), fy0 = Y(yOf(ml)) - F(0.06 * r), fy1 = Y(yOf(first)) + F(0.08 * r);
    g.strokeRect(fx0, fy0, fx1 - fx0, fy1 - fy0);
    const cx = (fx0 + fx1) / 2, fw = fx1 - fx0, fh = fy1 - fy0;
    txt(g, `${ml}mL`, cx, fy0 + fh * 0.16, F(0.15 * r), 'center', 400);
    g.fillRect(cx - fw * 0.36, fy0 + fh * 0.27, fw * 0.72, fh * 0.26);              // marking patch
    if (screw) {
      const q = Math.min(fw * 0.38, fh * 0.28); qrPattern(g, cx - q / 2, fy0 + fh * 0.58, q, ml * 31 + 3);
      txt(g, 'Scan for Certificate', cx, fy0 + fh * 0.58 + q + F(0.05 * r), F(0.045 * r), 'center', 400);
    } else {
      txt(g, 'IS : 1381 Part-1', cx, fy0 + fh * 0.62, F(0.06 * r), 'center', 400);
      const q = Math.min(fw * 0.32, fh * 0.24); qrPattern(g, cx - q / 2, fy0 + fh * 0.7, q, ml * 17 + 5);   // QR (owner: instead of ISI mark + number)
    }
  } });
}

const F = {};
// Caps & lids are their own items. fit = which vessels they close (all vial caps are the same size,

const VIAL_NECK = 0.0105, SCREW_NECK = 0.0125;

  amber:'Stock bottle cap (amber bottle)', hdpe:'Stock bottle cap (plastic bottle)', stockjar:'Stock jar lid', carboy:'Carboy cap',
  petri90:'Petri dish lid — 90 mm', petri60:'Petri dish lid — 60 mm' };
F.cap = fit => {

    for (let i = 0; i < 18; i++) { const r = box(0.0008, 0.011, 0.0012, colMat('#e2e2dc', 0.6)); const a = i / 18 * Math.PI * 2;
      r.position.set(Math.sin(a) * (VIAL_NECK + 0.0019), 0.006, Math.cos(a) * (VIAL_NECK + 0.0019)); r.rotation.y = a; it.obj.add(r); }

    ribs(it.obj, SCREW_NECK + 0.0033, 0.016, 0.008, 30, colMat('#2a63c0', 0.5));

    const c = cyl(r, r, h, colMat(col, 0.45), 32); c.position.y = h / 2; it.obj.add(c);
    const top = cyl(r * 0.94, r, 0.002, colMat(col, 0.35), 32); top.position.y = h + 0.0005; it.obj.add(top);
    ribs(it.obj, r + 0.0003, h, h / 2, fit === 'stockjar' ? 40 : 28, colMat(col, 0.5));

    it.r = 0.031; it.capH = 0.014;
  } else {

    const pts = [[0.0001, LH], [LR, LH], [LR, 0], [LR - w, 0], [LR - w, LH - w], [0.0001, LH - w]].map(([r, y]) => new THREE.Vector2(r, y));
    const m = mesh(new THREE.LatheGeometry(pts, 48), M.glass); m.renderOrder = 3; it.obj.add(m);
    it.r = LR + 0.002; it.capH = LH; it.lidOffset = H - LH + 0.0025;

};
// put a cap on a vessel (vessel must be open and the cap must fit)
function attachCap(cap, v) {
  v.obj.add(cap.obj); cap.obj.position.set(0, v.capY, 0); cap.obj.rotation.set(0, 0, 0);
  v.cap = cap; cap.onVessel = v; cap.prevVessel = null;
}
function capOn(cap, v) {
  if (held === cap) { held = null; ring.visible = false; updateHand(); }
  removeFrom(cap); attachCap(cap, v); touch(v);
  if (cap.home && cap.home !== v) mistake('capSwap', `That cap belongs to ${cap.home.name} — swapping stock caps cross-contaminates chemicals.`, v);
}
// open a vessel without picking the cap up: the cap is set down next to it
function capOffBeside(v, near = v) {
  const cap = v.cap; if (!cap) return;
  v.cap = null; cap.onVessel = null; v.obj.remove(cap.obj); cap.baseY = 0; cap.prevVessel = v;
  if (HK.opened) HK.opened(v);
  // nearest free spot around the vessel (or the item it is held over; on a hotplate -> around the hotplate)
  let base = near, s = near.surface; if (s && s.snap && s.owner) { base = s.owner; s = s.owner.surface; }
  let p = null;
  if (s && !s.snap) {
    const bx = base.obj.position.x, bz = base.obj.position.z;
    for (let rr = base.r + cap.r + 0.01; rr < 0.6 && !p; rr += 0.01)
      for (let k = 0; k < 24 && !p; k++) {
        const a = Math.PI / 2 + k * Math.PI * 2 / 24 * (k % 2 ? 1 : -1) / 2;   // try the front first, then fan out
        const c = evalSpot(cap, s, bx + Math.sin(a) * rr, bz + Math.cos(a) * rr);
        if (c.ok && Math.hypot(c.x - bx, c.z - bz) > base.r + cap.r) p = { x:c.x, z:c.z };
      }
  }
  if (!p) { s = (s && !s.snap) ? s : sMain; p = findFree(s, cap); }
  if (p) placeOn(cap, s, p.x, p.z);
  touch(v); toast(`${v.name} opened — the ${capWord(cap)} is beside it.`);
}
// Screw thread on the neck (seen when the cap is off): a raised helix, ~2 turns, in the neck's own
// material, inside the cap's footprint (hidden by the cap when closed). Measured from the cap seat.
const THREAD = {   // fit: neck radius, thread from / to (above capY), turns, material
  vial:     () => [VIAL_NECK, 0.0024, 0.0072, 2.0, M.glass],
  screw:    () => [SCREW_NECK, 0.0007, 0.0088, 2.3, M.glass],
  jar:      () => [0.028, 0.0005, 0.0052, 1.6, M.glass],

function addThread(v, fit, capY) {
  const t = THREAD[fit]; if (!t) return;

    const pts = [], n = Math.round(turns * 48);

    const tg = new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), n, 0.00055, 6, false);
    gr.add(new THREE.Mesh(tg, mat));

}

}

function refreshSubstrate(it) {
  const vol = totLiq(it.contents);
  if (vol > 0) {
    const fresh = vol !== it._lookVol || simTime - (it._lookT || -9) > 0.15;
    const look = fresh ? contentsLook(it) : null; if (fresh) { it._lookT = simTime; it._lookVol = vol; }
    const r = Math.min(0.0125, Math.sqrt(vol * 1e-6 / (Math.PI * 0.0006)));   // ~0.6 mm high puddle, limited by the slide width
    it.puddle.visible = true; it.puddle.scale.set(r, r, 1);
    if (look) { it.puddle.material.color.copy(look.col); it.puddle.material.opacity = Math.max(0.45, look.opacity); }
  } else it.puddle.visible = false;
  if (it.film) { it.filmMesh.visible = true; it.filmMesh.material.color.copy(it.film.col); it.filmMesh.material.opacity = Math.min(0.85, 0.22 + 0.12 * it.film.layers + 0.15 * it.film.strength); }
  else it.filmMesh.visible = false;
}

function spinStart(it) {
  const m = it.machine, st = m.steps.filter(x => x.rpm > 0 && x.time > 0);
  if (!st.length) { toast('Set at least one step (rpm and seconds) first.'); return; }
  if (m.lidOpen) mistake('spinLidOpen', 'Spinning with the lid open — solution can fly out. Close the lid first.', it);
  const sub = it.chuckSurface.items[0];
  if (!sub) toast('Nothing on the chuck — it spins empty.');
  m.prog = st; m.running = true; m.phase = 0; m.t = 0; m.maxRpm = 0;
  if (sub) {
    sub.spinDose = 0; sub.spinVol = totLiq(sub.contents); sub.spinLook = contentsLook(sub);
    const dil = { liq:{ ...sub.contents.liq }, sol:{}, dis:{} }; for (const k in sub.contents.dis) dil.dis[k] = sub.contents.dis[k] * 0.1;
    sub.spinThin = contentsLook({ contents: dil, maxTemp: sub.maxTemp || 25 });
  }
}
function spinStop(it, done) {
  const m = it.machine; m.running = false;
  const sub = it.chuckSurface.items[0];
  if (sub && sub.spinVol > 0 && m.maxRpm > 200) {
    // literature: film thickness ~ 1 / sqrt(rpm) (Meyerhofer). Relative to 3000 rpm = 1.0x.
    const rel = Math.sqrt(3000 / m.maxRpm);
    const look = sub.spinLook || { col: new THREE.Color('#eef4ff'), opacity:0.2 };
    // a spun film is very thin: only a pale tint of the solution colour, a bit deeper with each layer
    // thin film ~ a very short light path: colour of the solution at 1/10 strength (Beer–Lambert idea)
    const thin = sub.spinThin || look; const tint = thin.col.clone();
    const f = sub.film || { layers:0, col: tint.clone(), strength:0 };
    f.layers++; f.rpm = m.maxRpm; f.rel = rel; f.col.lerp(tint, 0.5).multiplyScalar(f.layers > 1 ? 0.97 : 1); f.strength = Math.min(1, look.opacity * rel * 0.6);
    sub.film = f; sub.contents = emptyC(); sub.spinVol = 0;
    toast(`${done ? 'Spin finished' : 'Stopped'} — the slide is coated (layer ${f.layers}).`, 'ok');
  } else toast(done ? 'Spin finished.' : 'Stopped.');
}
function spinTick(it, dt) {
  const m = it.machine;
  let target = 0;
  if (m.running) {
    const st = m.prog[m.phase]; target = st.rpm; m.t += dt;
    if (m.t >= st.time) { m.phase++; m.t = 0; if (m.phase >= m.prog.length) spinStop(it, true); }
  }
  m.actRpm = approach(m.actRpm, target, 2500, 3000, dt); m.maxRpm = Math.max(m.maxRpm, m.actRpm);
  it.spinner.rotation.y += Math.min(m.actRpm, 900) / 60 * Math.PI * 2 * dt;   // (capped so the eye still sees it turn)
  const want = m.lidOpen ? 1 : 0; it.lidAngle += (want - it.lidAngle) * Math.min(1, dt * 8); it.lidHinge.rotation.x = -1.3 * it.lidAngle;
  const sub = it.chuckSurface.items[0];
  if (sub && m.actRpm > 300 && !m.vacuum) {          // no vacuum -> the slide is thrown off
    mistake('noVacuum', 'The vacuum was off — the slide flew off the chuck! Turn the vacuum on before spinning.', it);
    const s = it.surface; removeFrom(sub); sub.baseY = 0; sub.flags.flewOff = true;
    let p = s && findFree(s, sub); if (s && p) placeOn(sub, s, p.x, p.z); else { const q = findFree(sMain, sub); if (q) placeOn(sub, sMain, q.x, q.z); }
    sub.contents = emptyC();
  }
}

/* ---------- footprints ----------
   Round items: a circle of radius it.r. LONG items (length >= 2 x width: spatula, rod, tweezers, lying
   pipettes, stir bars, slides...) : a rectangle that turns with the item (it.rotY), so sticks can lie
   side by side. A long item lies along the surface length (local x); 90 deg is tried when that does not fit. */
function fpOf(it) {
  if (it._fp !== undefined) return it._fp;
  if (it.machine || it.fixed || it.vessel || it.slots) return (it._fp = null);
  const wasUp = it.upright, rot = it.obj.rotation.y;
  if (it.lie) setPose(it, false);
  it.obj.rotation.y = 0; it.obj.updateMatrixWorld(true);
  const inv = new THREE.Matrix4().copy(it.obj.matrixWorld).invert(), b = new THREE.Box3(), t = new THREE.Box3(), m = new THREE.Matrix4();
  (function walk(o) { if (!o.visible) return; if (o.isMesh && o.material !== HITMAT) { o.geometry.computeBoundingBox(); t.copy(o.geometry.boundingBox).applyMatrix4(m.multiplyMatrices(inv, o.matrixWorld)); b.union(t); } o.children.forEach(walk); })(it.obj);
  it.obj.rotation.y = rot; if (it.lie && wasUp) setPose(it, true);
  if (b.isEmpty()) return (it._fp = null);
  const hx = (b.max.x - b.min.x) / 2 + 0.002, hz = (b.max.z - b.min.z) / 2 + 0.002;
  if (Math.max(hx, hz) < 2 * Math.min(hx, hz)) return (it._fp = null);
  return (it._fp = { hx, hz, cx: (b.max.x + b.min.x) / 2, cz: (b.max.z + b.min.z) / 2, along: hz > hx ? Math.PI / 2 : 0 });

// shape of it at (x, z) turned by rot, in surface coordinates
function fpShape(it, x, z, rot) {

  const co = Math.cos(rot), si = Math.sin(rot);

}
function fpExt(it, rot) {                    // half extents along the surface x / z (edge fitting)
  const f = fpOf(it); if (!f) return { ex: it.r, ez: it.r, ox: 0, oz: 0 };

    const R = A.c ? B : A, C = A.c ? A : B, dx = C.x - R.x, dz = C.z - R.z;
    const lx = Math.max(-R.hx, Math.min(R.hx, dx * R.u[0] + dz * R.u[1])), lz = Math.max(-R.hz, Math.min(R.hz, dx * R.v[0] + dz * R.v[1]));

    const rb = B.hx * Math.abs(B.u[0] * n[0] + B.u[1] * n[1]) + B.hz * Math.abs(B.v[0] * n[0] + B.v[1] * n[1]);

const chemOrder = [['bi', 'fe', 'citric', 'peg', 'naoh'], ['mn', 'co', 'ni', 'cr', 'la', 'sm', 'nd'], ['hno3', 'moe', 'acetic', 'acac', 'eg'], ['acetone', 'ethanol', 'ipa'], ['water']];

/* =====================================================================
   CONTENTS HELPERS
   ===================================================================== */
const sum = o => Object.values(o).reduce((a, b) => a + b, 0);
const totLiq = c => sum(c.liq);
const totSol = c => sum(c.sol);
const totAll = c => totLiq(c) + totSol(c) + sum(c.dis);
const chemsIn = c => [...new Set([...Object.keys(c.liq), ...Object.keys(c.sol), ...Object.keys(c.dis)])];
function clean0(c) { for (const k of ['liq', 'sol', 'dis']) for (const id in c[k]) if (c[k][id] < 1e-7) delete c[k][id]; }
function takeLiquidFraction(c, f, withUndissolved = false) {
  const out = emptyC(); f = Math.max(0, Math.min(1, f));
  for (const id in c.liq) { out.liq[id] = c.liq[id] * f; c.liq[id] -= out.liq[id]; }
  for (const id in c.dis) { out.dis[id] = c.dis[id] * f; c.dis[id] -= out.dis[id]; }
  if (withUndissolved) for (const id in c.sol) { out.sol[id] = c.sol[id] * f; c.sol[id] -= out.sol[id]; }
  clean0(c); clean0(out); return out;
}
function takeSolid(c, g) {
  const out = emptyC(); const t = totSol(c); if (t <= 0) return out; const f = Math.min(1, g / t);
  for (const id in c.sol) { out.sol[id] = c.sol[id] * f; c.sol[id] -= out.sol[id]; }
  clean0(c); clean0(out); return out;
}
function addC(dst, part) {
  for (const k of ['liq', 'sol', 'dis']) for (const id in part[k]) dst[k][id] = (dst[k][id] || 0) + part[k][id];
}
function contentsMass(c) { let m = totSol(c) + sum(c.dis); for (const id in c.liq) m += c.liq[id] * (CHEM[id].rho || 1); return m; }
const short = id => CHEM[id].name.replace(' (glacial)', '').replace(' pellets', '');
function describe(c) {
  const parts = [];
  for (const id in c.liq) parts.push(`${fmtVol(c.liq[id])} ${short(id)}`);
  const sids = new Set([...Object.keys(c.sol), ...Object.keys(c.dis)]);
  for (const id of sids) {
    const s = c.sol[id] || 0, d = c.dis[id] || 0, t = s + d;
    parts.push(`${t.toFixed(4)} g ${short(id)}` + (totLiq(c) > 0 ? ` (${Math.round(100 * d / t)}% dissolved)` : ''));
  }
  return parts.join(' + ');
}
const fmtVol = ml => ml < 1 ? `${Math.round(ml * 1000)} µl` : `${ml.toFixed(ml < 10 ? 2 : 1)} ml`;

/* ---------- colour ---------- */
// Absorbance-style mixing: each coloured species filters the light (like Beer–Lambert),
// so colours stay saturated and deepen with concentration.
function contentsLook(it) {
  const c = it.contents, vol = totLiq(c);
  if (vol <= 0) return null;
  const conc = {}; for (const id in CHEM) conc[id] = 0;
  for (const id in c.dis) conc[id] = c.dis[id] / vol;
  for (const id in c.liq) conc[id] = c.liq[id] / vol;
  const col = new THREE.Color(0.93, 0.96, 1.0); let A = 0, cloudy = null; const hasRx = new Set();
  const absorb = (hex, w) => { if (w <= 0) return; w = Math.min(w, 4); const k = new THREE.Color(hex);
    col.r *= Math.pow(Math.max(k.r, 0.002), w); col.g *= Math.pow(Math.max(k.g, 0.002), w); col.b *= Math.pow(Math.max(k.b, 0.002), w); A += w; };
  for (const rx of REACTIONS) { const w = rx.strength(conc, it); if (w > 0) { hasRx.add(rx.id); if (rx.cloudy) cloudy = rx.color; else absorb(rx.color, w); } }
  for (const id in c.dis) { const ch = CHEM[id]; if (!ch.sol) continue; if (id === 'cr' && hasRx.has('cr_heat')) continue; if (id === 'fe' && hasRx.has('fe_acac')) continue; absorb(ch.sol, ch.k * conc[id]); }
  for (const id in c.liq) { const ch = CHEM[id]; if (ch.liq) absorb(ch.liq, (ch.k || 0.5) * conc[id]); }
  let opacity = 0.22 + 0.68 * (1 - Math.exp(-A));
  if (cloudy) { col.lerp(new THREE.Color(cloudy), 0.75); opacity = Math.max(opacity, 0.9); }
  return { col, opacity };
}

let simTime = 0;
const mistakes = [];
let lastToast = { text:'', t:-9 };
function toast(text, cls = 'info', ms = 3800) {
  if (text === lastToast.text && performance.now() / 1000 - lastToast.t < 1.5) return;
  lastToast = { text, t: performance.now() / 1000 };
  const d = document.createElement('div'); d.className = 'toast ' + cls; d.textContent = text;
  $('#toasts').appendChild(d);
  while ($('#toasts').children.length > 4) $('#toasts').firstChild.remove();
  setTimeout(() => d.remove(), ms);
}
function mistake(kind, text, it) {

  $('#bLog').textContent = `Mistakes (${mistakes.length})`;

}

function statusOf(it) {
  const s = [];
  if (it.clean === 'dirty') s.push('Dirty');
  else if (it.clean === 'basin') s.push('Washed in basin (not solvent-rinsed)');
  else if (it.clean === 'clean') s.push('Clean');
  else if (it.clean === 'new') s.push(it.flags.used ? 'Used (single-use)' : 'New');
  if (it.wet) s.push(`Drying — ${Math.ceil(secsLeft(it))} s left`);
  if (it.residue.size && it.clean !== 'dirty' && totAll(it.contents) <= 0) s.push(`Residue of ${[...it.residue].map(short).join(', ')}`);
  if (it.isMain) s.push('Stock bottle — contents not visible');
  else if (it.type === 'washBottle') s.push(`${fmtVol(totLiq(it.contents))} left`);
  else if (totAll(it.contents) > 0) s.push(describe(it.contents));
  if (it.vessel && totLiq(it.contents) > 0 && it.temp > 27) s.push(`${Math.round(it.temp)} °C`);
  if (it.stirBar) s.push('Stir bar inside');
  if (it.capFit) s.push(it.cap ? `Closed — click the ${capWord(it.cap)} to open` : 'Open — bring a cap near the mouth to close it');
  if (it.type === 'cap') s.push(it.onVessel ? `On ${it.onVessel.name} — click or drag to take it off` : 'Drop it on a matching vessel to close it');
  if (it.type === 'micropipette') s.push(`Set to ${it.setVol} µl · ${it.tip ? (it.tip.used ? 'used tip' : 'fresh tip') : 'no tip'}`);
  if (it.type === 'syringe') s.push(it.filter ? (it.filter.used ? 'used filter attached' : 'filter attached') : 'no filter');
  if (it.type === 'bin') s.push(`${it.count} item${it.count === 1 ? '' : 's'} thrown away so far`);
  if (it.type === 'substrate') {
    if (it.film) s.push(`Coated: ${it.film.layers} layer${it.film.layers > 1 ? 's' : ''}, last at ${it.film.rpm} rpm (relative thickness ${it.film.rel.toFixed(2)}×) — wet film`);
    if (it.surface && it.surface.kind === 'chuck') s.push(it.surface.owner.machine.vacuum ? 'On the chuck — vacuum holding' : 'On the chuck — vacuum OFF');
  }
  if (it.type === 'spincoater') { const m = it.machine; s.push(`Lid ${m.lidOpen ? 'open' : 'closed'} · vacuum ${m.vacuum ? 'on' : 'off'}${m.running ? ' · spinning' : ''}`); }
  if (it.machine && it.type === 'hotplate') s.push(it.machine.heat ? `Max ${it.machine.maxT} °C · ${it.machine.maxRpm} rpm` : `No heating · max ${it.machine.maxRpm} rpm`);
  if (it.fixed && it.type === 'basin') s.push('Bring an item here to wash it · click a tap lever to turn the water on/off');
  return s.join(' · ');
}

function secsLeft(it) { return it.wet ? (1 - it.wet.p) * (it.wet.total || DRY_AIR[it.wet.solvent]) : 0; }
function checkClean(x) {
  if (!x || x.clean === 'na' || x.clean === undefined) return;
  if (x.clean === 'dirty') mistake('dirty', `${x.name} is dirty — it will contaminate your chemical / final product.`, x);
  else if (x.clean === 'basin') mistake('notRinsed', `${x.name} was only washed with water — rinse it with acetone, ethanol or IPA.`, x);
  if (x.wet) mistake('wet', `${x.name} is not dried yet — ${Math.ceil(secsLeft(x))} s left.`, x);
}
function checkResidue(x, incoming) {
  if (!x || totAll(x.contents) > 0 || !x.residue.size || x.clean === 'dirty') return;
  for (const id of incoming) if (!x.residue.has(id)) {
    mistake('contamination', `${x.name} still has ${[...x.residue].map(short).join(', ')} residue — wash it before using it for a different chemical.`, x);
    return;
  }
}
function receive(dst, part, { checks = true } = {}) {
  const ids = chemsIn(part);
  if (checks) { checkClean(dst); checkResidue(dst, ids); }
  addC(dst.contents, part); ids.forEach(id => dst.residue.add(id));
  dst.lastUsed = simTime;
}
function touch(it) { it.lastUsed = simTime; }

const isContainer = x => x.type === 'vessel' || x.type === 'mainBottle';
const canHoldLiquid = x => (isContainer(x) && !x.solidsOnly) || x.type === 'substrate';
